<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search Results — PrivacyLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            obsidian: "#090D16",
            cardDark: "#111827",
            wellDark: "#0F172A",
            borderDark: "#1E293B",
            accentTeal: "#0D9488",
            riskLow: "#059669",
            riskMod: "#D97706",
            riskHigh: "#EA580C",
            riskCrit: "#E11D48",
          },
          fontFamily: {
            sans: ["Geist", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 dark:bg-obsidian text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-accentTeal selection:text-white transition-colors duration-200">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-50 bg-white/80 dark:bg-[#090D16]/90 backdrop-blur-md border-b border-slate-200 dark:border-borderDark transition-colors">
    <div class="max-w-4xl mx-auto h-16 px-4 sm:px-6 flex items-center justify-between gap-4">
      
      <a href="index.html" class="flex items-center gap-2.5 shrink-0">
        <div class="w-9 h-9 rounded-xl bg-teal-50 dark:bg-wellDark border border-teal-200 dark:border-borderDark flex items-center justify-center text-accentTeal shadow-sm">
          <i data-lucide="shield-check" class="w-5 h-5 text-accentTeal"></i>
        </div>
        <span class="font-sans font-bold text-lg tracking-tight text-slate-900 dark:text-white">PrivacyLens</span>
      </a>

      <!-- Compact Search Input -->
      <form action="search.html" method="GET" class="flex-1 max-w-md flex items-center bg-white dark:bg-cardDark border border-slate-300 dark:border-borderDark rounded-xl px-3 py-1.5 focus-within:border-accentTeal shadow-sm">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2 shrink-0"></i>
        <input 
          type="text" 
          name="q" 
          id="query-input"
          class="w-full bg-transparent text-xs sm:text-sm text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none"
          placeholder="Search Android app..."
          required
        />
        <button type="submit" class="text-xs font-semibold text-accentTeal hover:underline ml-2">Search</button>
      </form>

      <!-- Right Controls: Theme Toggle Button -->
      <div class="flex items-center gap-2">
        <button 
          onclick="toggleTheme()" 
          class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-cardDark dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-600 dark:text-slate-300 transition-colors shadow-sm"
          title="Toggle light/dark theme"
          type="button"
          aria-label="Toggle theme"
        >
          <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden"></i>
          <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN SEARCH RESULTS -->
  <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 py-8 w-full space-y-4">
    
    <!-- Results Header -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-borderDark">
      <div>
        <h1 class="font-sans font-bold text-lg sm:text-xl text-slate-900 dark:text-white flex items-center gap-2">
          <span>Results for</span>
          <span id="query-display" class="text-accentTeal font-mono">...</span>
        </h1>
        <p id="results-count-text" class="font-sans text-xs text-slate-500 dark:text-slate-400 mt-0.5">
          Select the specific app you want to inspect.
        </p>
      </div>
      <a href="index.html" class="text-xs font-medium text-slate-500 hover:text-accentTeal flex items-center gap-1 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>New Search</span>
      </a>
    </div>

    <!-- Status / Notification Banner (if any) -->
    <div id="status-banner" class="hidden text-xs px-3.5 py-2.5 rounded-xl border"></div>

    <!-- Loading State -->
    <div id="loading-state" class="py-16 text-center space-y-3">
      <div class="w-10 h-10 border-2 border-accentTeal/20 border-t-accentTeal rounded-full animate-spin mx-auto"></div>
      <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Searching Google Play Store...</p>
    </div>

    <!-- App Cards Container -->
    <div id="results-container" class="space-y-3 hidden"></div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden py-16 text-center space-y-3">
      <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-cardDark border border-slate-200 dark:border-borderDark flex items-center justify-center mx-auto text-slate-400">
        <i data-lucide="search-x" class="w-6 h-6"></i>
      </div>
      <h2 class="text-base font-bold text-slate-900 dark:text-white">No Matching Apps Found</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
        We couldn't find any Google Play apps matching your search. Please check the spelling or try another term.
      </p>
    </div>

  </main>

  <!-- NO FOOTER -->

  <script type="module">
    import { mockSearchResults } from './mock-data.js';

    const urlParams = new URLSearchParams(window.location.search);
    const query = (urlParams.get('q') || '').trim();

    const queryDisplay = document.getElementById('query-display');
    const queryInput = document.getElementById('query-input');
    const loadingState = document.getElementById('loading-state');
    const resultsContainer = document.getElementById('results-container');
    const emptyState = document.getElementById('empty-state');
    const countText = document.getElementById('results-count-text');
    const statusBanner = document.getElementById('status-banner');

    if (query) {
      queryDisplay.textContent = `"${query}"`;
      queryInput.value = query;
      performSearch(query);
    } else {
      queryDisplay.textContent = "None";
      loadingState.classList.add('hidden');
      emptyState.classList.remove('hidden');
      countText.textContent = "Please enter an app name to search.";
      lucide.createIcons();
    }

    async function performSearch(searchTerm) {
      loadingState.classList.remove('hidden');
      resultsContainer.classList.add('hidden');
      emptyState.classList.add('hidden');

      let apps = [];
      let isLiveBackend = false;

      try {
        // Attempt live backend search on localhost:4000
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);

        const res = await fetch(`http://localhost:4000/api/search?q=${encodeURIComponent(searchTerm)}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.results)) {
            apps = data.results;
            isLiveBackend = true;
          }
        }
      } catch (err) {
        console.warn('Backend search unreachable, falling back to local dataset:', err);
      }

      if (!isLiveBackend) {
        // Fallback to local mock data
        const lower = searchTerm.toLowerCase();
        apps = mockSearchResults.filter(item => 
          (item.name || item.title || '').toLowerCase().includes(lower) ||
          item.appId.toLowerCase().includes(lower) ||
          (item.developer || '').toLowerCase().includes(lower)
        );

        if (apps.length === 0 && mockSearchResults.length > 0) {
          // If no direct keyword match in mock data, show available mock items as recommendations
          apps = mockSearchResults;
          showBanner('Notice: Backend offline. Showing available demo applications.', 'bg-slate-100 dark:bg-cardDark border-slate-200 dark:border-borderDark text-slate-600 dark:text-slate-300');
        } else {
          showBanner('Notice: Live backend offline. Results retrieved from offline demo dataset.', 'bg-teal-50 dark:bg-accentTeal/10 border-teal-200 dark:border-accentTeal/30 text-accentTeal');
        }
      }

      loadingState.classList.add('hidden');

      if (!apps || apps.length === 0) {
        emptyState.classList.remove('hidden');
        countText.textContent = "0 apps found.";
      } else {
        renderResults(apps);
        countText.textContent = `${apps.length} app${apps.length === 1 ? '' : 's'} found • Click to inspect privacy`;
      }

      lucide.createIcons();
    }

    function showBanner(text, classes) {
      statusBanner.textContent = text;
      statusBanner.className = `text-xs px-3.5 py-2.5 rounded-xl border ${classes}`;
      statusBanner.classList.remove('hidden');
    }

    function renderResults(apps) {
      resultsContainer.innerHTML = '';
      resultsContainer.classList.remove('hidden');

      apps.forEach((app, index) => {
        const appName = app.name || app.title || app.appId;
        const developer = app.developer || 'Developer not listed';
        const rating = typeof app.rating === 'number' && !isNaN(app.rating) ? app.rating.toFixed(1) : null;
        const category = app.category || null;
        const iconUrl = app.icon || null;

        // Card wrapper
        const card = document.createElement('div');
        card.className = "p-4 rounded-2xl bg-white dark:bg-cardDark border border-slate-200 dark:border-borderDark hover:border-accentTeal dark:hover:border-accentTeal shadow-sm transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4";

        // Details column
        const infoCol = document.createElement('div');
        infoCol.className = "flex items-center gap-3.5 min-w-0";

        // Icon element
        const iconWrapper = document.createElement('div');
        iconWrapper.className = "w-14 h-14 rounded-2xl bg-teal-50 dark:bg-wellDark border border-teal-100 dark:border-borderDark flex items-center justify-center shrink-0 overflow-hidden";

        if (iconUrl) {
          const img = document.createElement('img');
          img.src = iconUrl;
          img.alt = appName;
          img.className = "w-full h-full object-cover";
          img.onerror = () => {
            iconWrapper.innerHTML = '<i data-lucide="smartphone" class="w-6 h-6 text-accentTeal"></i>';
            lucide.createIcons();
          };
          iconWrapper.appendChild(img);
        } else {
          iconWrapper.innerHTML = '<i data-lucide="smartphone" class="w-6 h-6 text-accentTeal"></i>';
        }

        const textDetails = document.createElement('div');
        textDetails.className = "min-w-0";

        const titleRow = document.createElement('div');
        titleRow.className = "flex items-center gap-2 flex-wrap";
        
        const heading = document.createElement('h2');
        heading.className = "font-sans font-bold text-base text-slate-900 dark:text-white truncate";
        heading.textContent = appName;
        titleRow.appendChild(heading);

        const devP = document.createElement('p');
        devP.className = "font-sans text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate";
        devP.textContent = `By ${developer}`;

        const metaRow = document.createElement('div');
        metaRow.className = "flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 mt-1 flex-wrap";

        if (rating) {
          const ratingSpan = document.createElement('span');
          ratingSpan.className = "text-amber-500 font-semibold flex items-center gap-1";
          ratingSpan.innerHTML = `<i data-lucide="star" class="w-3.5 h-3.5 fill-current"></i> ${rating}`;
          metaRow.appendChild(ratingSpan);
        }

        if (category) {
          if (rating) {
            const dot = document.createElement('span');
            dot.textContent = "•";
            metaRow.appendChild(dot);
          }
          const catSpan = document.createElement('span');
          catSpan.textContent = category;
          metaRow.appendChild(catSpan);
        }

        textDetails.appendChild(titleRow);
        textDetails.appendChild(devP);
        textDetails.appendChild(metaRow);

        infoCol.appendChild(iconWrapper);
        infoCol.appendChild(textDetails);

        // Action button column
        const actionCol = document.createElement('div');
        actionCol.className = "shrink-0 self-end sm:self-center";

        const analyzeUrl = `analysis.html?appId=${encodeURIComponent(app.appId)}&name=${encodeURIComponent(appName)}&icon=${encodeURIComponent(iconUrl || '')}&dev=${encodeURIComponent(developer)}&rating=${encodeURIComponent(rating || '')}&cat=${encodeURIComponent(category || '')}`;

        const actionBtn = document.createElement('a');
        actionBtn.href = analyzeUrl;
        actionBtn.className = "px-4 py-2 bg-accentTeal hover:bg-teal-700 active:translate-y-[1px] text-white font-sans text-xs font-semibold rounded-xl flex items-center gap-1.5 transition-all shadow-sm";
        actionBtn.innerHTML = `<span>Check Privacy</span><i data-lucide="arrow-right" class="w-4 h-4"></i>`;

        actionCol.appendChild(actionBtn);

        card.appendChild(infoCol);
        card.appendChild(actionCol);

        resultsContainer.appendChild(card);
      });
    }

    window.toggleTheme = function() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcons();
    };

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sun = document.getElementById('theme-icon-sun');
      const moon = document.getElementById('theme-icon-moon');
      if (sun && moon) {
        sun.classList.toggle('hidden', !isDark);
        moon.classList.toggle('hidden', isDark);
      }
    }

    updateThemeIcons();
    lucide.createIcons();
  </script>
</body>
</html>
