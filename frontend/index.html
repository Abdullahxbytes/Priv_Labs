<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivacyLens — Know Before You Install</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (localStorage.getItem("theme") === "dark") {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              obsidian: "#090D16",
              cardDark: "#111827",
              wellDark: "#0F172A",
              borderDark: "#1E293B",
              accentTeal: "#0D9488",
              riskLow: "#059669",
              riskMod: "#D97706",
              riskHigh: "#EA580C",
              riskCrit: "#E11D48",
            },
            fontFamily: {
              sans: ["Geist", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 dark:bg-obsidian text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-accentTeal selection:text-white transition-colors duration-200"
  >
    <!-- TOP APP BAR -->
    <header
      class="sticky top-0 z-50 bg-white/80 dark:bg-[#090D16]/90 backdrop-blur-md border-b border-slate-200 dark:border-borderDark transition-colors"
    >
      <div class="max-w-5xl mx-auto h-16 px-4 sm:px-6 flex items-center justify-between gap-4">
        <!-- Brand Logo with Lucide Icon -->
        <a href="index.html" class="flex items-center gap-2.5">
          <div
            class="w-9 h-9 rounded-xl bg-teal-50 dark:bg-wellDark border border-teal-200 dark:border-borderDark flex items-center justify-center text-accentTeal shadow-sm"
          >
            <i data-lucide="shield-check" class="w-5 h-5 text-accentTeal"></i>
          </div>
          <span class="font-sans font-bold text-lg tracking-tight text-slate-900 dark:text-white"
            >PrivacyLens</span
          >
        </a>

        <!-- Right Controls: Theme Toggle Button -->
        <div class="flex items-center gap-2">
          <button
            id="theme-toggle-btn"
            onclick="toggleTheme()"
            class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-cardDark dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-600 dark:text-slate-300 transition-colors shadow-sm"
            title="Toggle light/dark theme"
            type="button"
            aria-label="Toggle theme"
          >
            <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden"></i>
            <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN LANDING VIEW -->
    <main
      class="flex-1 flex flex-col justify-center max-w-2xl mx-auto px-4 sm:px-6 py-20 w-full text-center"
    >
      <!-- Hero Header (Simple, friendly, zero jargon) -->
      <div class="mb-8">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-50 dark:bg-teal-950/40 border border-teal-200 dark:border-teal-800 text-accentTeal text-xs font-medium mb-4"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Simple App Privacy Checker</span>
        </div>
        <h1
          class="font-sans font-extrabold text-3xl sm:text-5xl text-slate-900 dark:text-white tracking-tight mb-3"
        >
          Know What Apps Know About You
        </h1>
        <p
          class="font-sans text-sm sm:text-base text-slate-600 dark:text-slate-400 max-w-lg mx-auto"
        >
          Check what permissions an app asks for and where your personal data goes before you hit
          install.
        </p>
      </div>

      <!-- Search Form -->
      <div class="w-full mb-6">
        <form
          action="search.html"
          method="GET"
          class="relative flex items-center bg-white dark:bg-cardDark border border-slate-300 dark:border-borderDark rounded-2xl p-2 focus-within:border-accentTeal focus-within:ring-2 focus-within:ring-accentTeal/20 shadow-lg shadow-slate-200/50 dark:shadow-none transition-all"
        >
          <div class="pl-3 pr-2 text-slate-400">
            <i data-lucide="search" class="w-5 h-5 text-slate-400"></i>
          </div>
          <input
            type="text"
            name="q"
            id="search-input"
            value="Spotify"
            placeholder="Search any Android app (e.g. Spotify, Duolingo, WhatsApp)..."
            class="w-full bg-transparent text-sm sm:text-base font-sans text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none px-2"
            required
          />
          <button
            type="submit"
            class="px-5 py-2.5 bg-accentTeal hover:bg-teal-700 active:translate-y-[1px] text-white font-sans text-xs sm:text-sm font-semibold rounded-xl flex items-center gap-1.5 transition-all shrink-0 shadow-sm"
          >
            <span>Check App</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </form>

        <!-- Quick Chips -->
        <div
          class="flex items-center justify-center gap-2 pt-4 flex-wrap text-xs text-slate-500 dark:text-slate-400"
        >
          <span class="text-slate-400">Try:</span>
          <a
            href="search.html?q=Spotify"
            class="px-3 py-1 rounded-full bg-white dark:bg-cardDark hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-700 dark:text-slate-200 shadow-sm transition-colors flex items-center gap-1"
          >
            <i data-lucide="headphones" class="w-3.5 h-3.5 text-accentTeal"></i>
            <span>Spotify</span>
          </a>
          <a
            href="search.html?q=Duolingo"
            class="px-3 py-1 rounded-full bg-white dark:bg-cardDark hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-700 dark:text-slate-200 shadow-sm transition-colors flex items-center gap-1"
          >
            <i data-lucide="languages" class="w-3.5 h-3.5 text-accentTeal"></i>
            <span>Duolingo</span>
          </a>
          <a
            href="search.html?q=WhatsApp"
            class="px-3 py-1 rounded-full bg-white dark:bg-cardDark hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-700 dark:text-slate-200 shadow-sm transition-colors flex items-center gap-1"
          >
            <i data-lucide="message-circle" class="w-3.5 h-3.5 text-accentTeal"></i>
            <span>WhatsApp</span>
          </a>
          <a
            href="search.html?q=Signal"
            class="px-3 py-1 rounded-full bg-white dark:bg-cardDark hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-borderDark text-slate-700 dark:text-slate-200 shadow-sm transition-colors flex items-center gap-1"
          >
            <i data-lucide="lock" class="w-3.5 h-3.5 text-accentTeal"></i>
            <span>Signal</span>
          </a>
        </div>
      </div>
    </main>

    <!-- NO FOOTER AS REQUESTED -->

    <script>
      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        updateThemeIcons();
      }

      function updateThemeIcons() {
        const isDark = document.documentElement.classList.contains("dark");
        const sun = document.getElementById("theme-icon-sun");
        const moon = document.getElementById("theme-icon-moon");
        if (sun && moon) {
          sun.classList.toggle("hidden", !isDark);
          moon.classList.toggle("hidden", isDark);
        }
      }

      updateThemeIcons();
      lucide.createIcons();
    </script>
  </body>
</html>
